<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wo bin ich?</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f7fd;
      margin: 0;
      padding: 35px 15px;
      font-size: 22px;
    }

    h1 {
      color: #1976d2;
      font-size: 42px;
      margin-bottom: 35px;
    }

    #status {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 20px 30px;
      font-size: 28px;
      cursor: pointer;
      width: 90%;
      max-width: 560px;
      margin-bottom: 30px;
    }

    #daten {
      line-height: 1.6;
      font-size: 24px;
    }

    .titel {
      font-weight: bold;
      font-size: 26px;
      margin-top: 25px;
    }

    #karte {
      margin-top: 30px;
      width: 100%;
      height: 350px;
    }

    #karte iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <h1>📍 Wo bin ich?</h1>

  <div id="status">
    Standort noch nicht bestimmt
  </div>

  <button onclick="standort()">
    Standort bestimmen
  </button>

  <div id="daten"></div>

  <div id="karte"></div>

  <script>
    function standort() {

      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerHTML = "Standortbestimmung wird nicht unterstützt.";
        return;
      }

      status.innerHTML = "Standort wird bestimmt ...";

      navigator.geolocation.getCurrentPosition(
        position => {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = position.coords.accuracy;
          status.innerHTML = "Standort bestimmt";

          const geo = geocachingKoordinaten(lat, lon);

          document.getElementById("daten").innerHTML =
            '<div class="titel">Geocaching-Koordinaten:</div>' +
            geo +
            '<div>Genauigkeit: ±' + Math.round(accuracy) + ' Meter</div>' +
            '<div id="adresse">Ort wird ermittelt ...</div>';

          adresseLaden(lat, lon);

          document.getElementById("karte").innerHTML =
            '<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=' +
            (lon - 0.01) + '%2C' +
            (lat - 0.006) + '%2C' +
            (lon + 0.01) + '%2C' +
            (lat + 0.006) +
            '&layer=mapnik&marker=' +
            lat + '%2C' + lon +
            '"></iframe>';
        },

        error => {
          status.innerHTML =
            "Standort konnte nicht bestimmt werden.";
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }


    function geocachingKoordinaten(lat, lon) {

      const ns = lat >= 0 ? "N" : "S";
      const ew = lon >= 0 ? "E" : "W";

      lat = Math.abs(lat);
      lon = Math.abs(lon);

      const latGrad = Math.floor(lat);
      const lonGrad = Math.floor(lon);

      const latMin = ((lat - latGrad) * 60).toFixed(3);
      const lonMin = ((lon - lonGrad) * 60).toFixed(3);

      return (
        ns + " " +
        String(latGrad).padStart(2, "0") +
        "° " +
        latMin +
        " " +
        ew + " " +
        String(lonGrad).padStart(3, "0") +
        "° " +
        lonMin
      );
    }


    async function adresseLaden(lat, lon) {

      const feld = document.getElementById("adresse");

      try {

        const url =
          "https://nominatim.openstreetmap.org/reverse?format=json&lat=" +
          lat +
          "&lon=" +
          lon +
          "&zoom=18&addressdetails=1";

        const antwort = await fetch(url);

        const daten = await antwort.json();

        const a = daten.address || {};
        
        const ort = a.village || a.suburb || a.neighbourhood || a.hamlet || a.town || a.city || "-";
        
          
          
          
          
          
          

        const landkreis =
          a.county ||
          a.state_district ||
          "-";

        const bundesland =
          a.state ||
          "-";

        feld.innerHTML =
          '<div class="titel">Landkreis:</div>' +
          landkreis +

          '<div class="titel">Ort:</div>' +
          ort +

          '<div class="titel">Bundesland:</div>' +
          bundesland;

      } catch (fehler) {

        feld.innerHTML =
          "<br>Ort konnte nicht ermittelt werden.";
      }
    }
  </script>

</body>
</html>
